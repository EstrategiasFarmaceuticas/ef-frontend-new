<main class="container absolute min-h-screen min-w-full overflow-hidden">
  <div class="top"></div>
  <div class="bottom"></div>
  <div class="absolute top-1/2 left-1/2 -mt-50 -ml-50 flex flex-col items-center justify-between p-8 opacity-0 center w-[25rem] h-[25rem]">
    <img src="logo.webp" alt="Logo" class="h-16" />
    <form [formGroup]="loginGroup" (ngSubmit)="onSubmit()"  class="flex flex-col justify-between gap-5">
      <div class="flex flex-col ">
        <label class="">Correo Electronico</label>
        <input formControlName="email" class="rounded-md border-2 px-5 py-2 transition-colors focus:outline-none" placeholder="¡El que te ha sido asignado!" />
      </div>
      <div class="flex flex-col">
        <label class="">Contraseña</label>
        <input formControlName="password" type="password" class="rounded-md border-2 px-5 py-2 transition-colors focus:outline-none" placeholder="Solo tu la conoces :)" />
      </div>
      <button type="submit" [disabled]="!loginGroup.valid" class="self-center w-fit cursor-pointer rounded-md bg-gray-700 disabled:bg-gray-400 disabled:cursor-not-allowed px-5 py-2 text-white shadow shadow-green-700 transition-colors hover:bg-green-600">Iniciar Sesión</button>
    </form>
  </div>
  <a class="forgotten opacity-0 text-white hover:text-gray-200 cursor-pointer text-xl z-20 absolute bottom-0 left-1/2 -ml-30 mb-5 text-center transition-colors transition-opacity ">He olvidado mi contraseña</a>
</main>
