<!-- Sección parallax solo para el banner -->
<div class="relative h-[300px] lg:h-[400px] overflow-hidden">
  <!-- Imagen de fondo fija -->
  <div class="fixed inset-0 w-full h-full -z-10">
    <img
      src="products.jpg"
      alt="Imagen de fondo"
      class="w-full h-full object-cover"
    />
    <!-- Capa de color azul semitransparente -->
    <div class="absolute inset-0 bg-[#1f7ec2] opacity-80"></div>
  </div>

  <!-- Contenido del banner (centrado vertical y horizontalmente) -->
  <div class="relative z-10 h-full flex items-center justify-center">
    <div class="text-center max-w-3xl mx-auto px-4">
      <h1 class="text-3xl md:text-4xl font-bold text-white mb-4">Nuestros Productos</h1>
      <p class="text-lg text-gray-200 mb-2">Todos nuestros productos tienen soporte clínico y brindan soluciones efectivas.</p>
      <p class="text-sm text-gray-300 italic"><em>(click on product image to go to that product's page)</em></p>
    </div>
  </div>
</div>

<!-- Loading State -->
<div *ngIf="isLoading" class="bg-white py-12 flex justify-center">
  <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
</div>

<!-- Error State -->
<div *ngIf="error && !isLoading" class="bg-white py-12 text-center">
  <p class="text-red-500 mb-4">{{ error }}</p>
  <button
    (click)="loadProducts()"
    class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition"
  >
    Try Again
  </button>
</div>

<!-- Contenido normal (se desplaza normalmente) -->
<div *ngIf="!isLoading && !error" class="bg-white">
  <div class="container mx-auto lg:px-12 py-8">
    <!-- Grid de productos - Centrado -->
    <div class="flex flex-wrap justify-center -mx-3">
      <div *ngFor="let product of products"
           class="w-full sm:w-1/2 md:w-1/3 lg:w-1/4 xl:w-1/5 px-3 mb-12 relative pb-8 sm:pb-0 flex justify-center">

        <!-- Contenedor principal centrado -->
        <div class="max-w-xs w-full">
          <!-- Línea sutil solo para móvil -->
          <div class="absolute bottom-0 left-1/2 transform -translate-x-1/2 w-3/4 h-px bg-blue-300 sm:hidden"></div>

          <div class="h-full flex flex-col items-center">
            <!-- Contenedor de imagen -->
            <div class="bg-white p-2 flex justify-center w-full" style="min-height: 180px;">
              <img [src]="product.imageUrl" [alt]="product.name"
                   class="h-full w-auto object-contain hover:scale-105 transition-transform duration-300
            max-h-[230px] sm:max-h-none"
                   [routerLink]="['/product', product.name]">
            </div>

            <!-- Texto -->
            <div class="text-center w-full px-2 mt-3 lg:mt-1">
              <h3 class="text-lg font-semibold text-[#1f7ec2] mb-1 lg:mb-0.5">
                {{ product.name }}
              </h3>
              <p class="text-sm text-gray-600 mt-1 lg:mt-0.5">
                {{ product.shortDesc }}
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
