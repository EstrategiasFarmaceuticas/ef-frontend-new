<a [routerLink]="['/blog', article().headerUrl]"
class="group block bg-white rounded-2xl border border-gray-100 overflow-hidden cursor-pointer hover:border-[#1f7ec2]/40 hover:shadow-xl hover:-translate-y-1 transition-all duration-300 h-full flex flex-col">

<!-- Imagen -->
<div class="relative aspect-[16/10] overflow-hidden bg-sky-50">
  <img
    [src]="isExternalImage ? article().headerImage : storageService.getFile(article().headerImage)"
    [alt]="article().title"
    class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
  />
  <!-- Overlay sutil en hover -->
  <div class="absolute inset-0 bg-gradient-to-t from-[#0c447c]/30 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
</div>

<!-- Contenido -->
<div class="p-5 lg:p-6 flex-1 flex flex-col">
  <!-- Meta info: fecha -->
  <div class="flex items-center gap-2 text-xs text-gray-500 mb-3">
    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
    </svg>
    <time>{{ article().creationDate | date: 'd MMM, y' }}</time>
  </div>

  <!-- Título -->
  <h3 class="text-xl font-bold text-[#0c447c] mb-3 leading-snug line-clamp-2 group-hover:text-[#1f7ec2] transition-colors">
    {{ article().title }}
  </h3>

  <!-- Descripción -->
  <p class="text-sm text-gray-600 leading-relaxed line-clamp-3 flex-1">
    {{ article().shortDesc }}
  </p>

  <!-- Footer con CTA -->
  <div class="mt-5 pt-4 border-t border-gray-100 flex items-center justify-between">
      <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">
        Leer artículo
      </span>
    <span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-sky-50 group-hover:bg-[#1f7ec2] transition-colors duration-300">
        <svg class="w-4 h-4 text-[#1f7ec2] group-hover:text-white transform group-hover:translate-x-0.5 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </span>
  </div>
</div>
</a>
