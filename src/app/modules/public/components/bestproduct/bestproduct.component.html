<section class="bg-gradient-to-t from-[#1F7EC2] to-[#FFFFFF] py-12">
  <div class="container mx-auto px-4">
    <!-- Título -->
    <h2 class="text-3xl text-center font-bold text-[#1F7EC2] mb-8">
      Nuestro Producto Más Vendido
    </h2>

    <!-- Contenedor principal -->
    <div class="flex flex-col md:flex-row items-center justify-between px-4 md:px-8 lg:px-12">
      <!-- Texto (izquierda en desktop, arriba en móvil) -->
      <div class="md:w-1/2 text-center md:text-center mb-4 md:mb-0">
        <h1 class="text-lg text-black md:text-gray-600 mb-4 md:mb-6">
          {{ bestProduct.shortDesc }}
        </h1>
        <a class="bg-white text-[#1F7EC2] py-2 px-6 rounded-full font-semibold hover:bg-gray-100 transition duration-300">
          Ver Producto
        </a>
      </div>

      <!-- Imagen (derecha en desktop, abajo en móvil) -->
      <div class="md:w-1/2 w-full flex justify-center">
        <img [src]="bestProduct.imageUrl" [alt]="bestProduct.name" class="w-full h-auto max-w-md">
      </div>
    </div>
  </div>
</section>
