<nav class="w-full bg- shadow-md">
  <div class="container mx-auto flex items-center justify-between p-4">
    <!-- Logo -->
    <img src="logo.webp" alt="Logo" class="h-10" />

    <!-- Botón de menú (solo en móviles) -->
    <button
      class="lg:hidden text-gray-700 hover:text-blue-500 focus:outline-none"
      (click)="toggleMenu()"
    >
      <svg
        class="h-6 w-6"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 12h16m-7 6h7"
        ></path>
      </svg>
    </button>

    <!-- Enlaces de navegación (ocultos en móviles) -->
    <div
      class="lg:flex lg:space-x-6 hidden"
      [class.hidden]="!isMenuOpen"
      [class.block]="isMenuOpen"
    >
      <a routerLink="" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="block lg:inline-block text-gray-700 hover:text-blue-500 mt-4 lg:mt-0">Inicio</a>
      <a routerLink="/products" routerLinkActive="active" class="block lg:inline-block text-gray-700 hover:text-blue-500 mt-4 lg:mt-0">Productos</a>
      <a routerLink="/about" routerLinkActive="active" class="block lg:inline-block text-gray-700 hover:text-blue-500 mt-4 lg:mt-0">Nosotros</a>
      <a routerLink="/blog" routerLinkActive="active" class="block lg:inline-block text-gray-700 hover:text-blue-500 mt-4 lg:mt-0">Blog</a>
    </div>
  </div>
</nav>
