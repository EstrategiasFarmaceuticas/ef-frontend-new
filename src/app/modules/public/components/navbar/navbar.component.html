<nav
  class="fixed w-full z-50 transition-all duration-300"
  [class.bg-white/90]="scrolled()"
  [class.backdrop-blur-xl]="scrolled()"
  [class.shadow-sm]="scrolled()"
  [class.bg-transparent]="!scrolled()"
>
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <a routerLink="/" class="flex-shrink-0">
        <img
          src="logo.webp"
          alt="Estrategias Farmacéuticas"
          class="h-11 w-auto transition-all duration-300"
        />
      </a>

      <div class="hidden lg:flex items-center gap-1">
        @for (link of navLinks; track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="text-[#1f7ec2] bg-[#1f7ec2]/5 font-semibold"
            [routerLinkActiveOptions]="{exact: link.exact}"
            class="px-4 py-2 text-sm rounded-lg text-gray-700 hover:text-[#1f7ec2] hover:bg-[#1f7ec2]/5 transition-all duration-200"
          >
            {{ link.label }}
          </a>
        }
      </div>

      <button
        class="lg:hidden relative w-8 h-8 flex items-center justify-center text-gray-700 hover:text-[#1f7ec2] transition-colors"
        (click)="toggleMenu()"
        aria-label="Menú de navegación"
      >
        <div class="w-5 h-4 relative flex flex-col justify-between">
          <span
            class="block h-0.5 w-full bg-current rounded-full transition-all duration-300 origin-center"
            [class.rotate-45]="isMenuOpen"
            [class.translate-y-[7px]]="isMenuOpen"
          ></span>
          <span
            class="block h-0.5 w-full bg-current rounded-full transition-all duration-300"
            [class.opacity-0]="isMenuOpen"
          ></span>
          <span
            class="block h-0.5 w-full bg-current rounded-full transition-all duration-300 origin-center"
            [class.-rotate-45]="isMenuOpen"
            [class.-translate-y-[7px]]="isMenuOpen"
          ></span>
        </div>
      </button>
    </div>
  </div>
</nav>

<app-mobile-menu [isOpen]="isMenuOpen" (closeMenu)="toggleMenu()"></app-mobile-menu>

@if (isMenuOpen) {
  <div class="fixed inset-0 bg-black/40 z-40 lg:hidden" (click)="toggleMenu()"></div>
}

<div class="h-16"></div>
