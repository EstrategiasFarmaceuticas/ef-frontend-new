<div class="relative flex h-screen w-64 flex-col rounded-tr-3xl bg-white bg-clip-border p-4 text-gray-700 shadow-xl shadow-blue-gray-900/5">
  <!-- Sección superior -->
  <div class="flex-1 overflow-y-auto">
    <div class="p-4 mb-2">
      <img src="logo.webp" alt="logo Estrategias Farmacéutticas">
    </div>

    <div class="flex items-center p-4 mb-4">
      <p class="ml-3 font-sans text-base antialiased font-normal leading-relaxed text-center text-blue-gray-900">Administrador</p>
    </div>

    <!-- Línea divisoria -->
    <hr class="my-2 border-blue-gray-50">

    <!-- Sección Administración -->
    <div class="relative block w-full">
      <div role="button"
           class="flex items-center w-full p-0 leading-tight transition-all rounded-lg outline-none text-start hover:bg-blue-gray-50 hover:bg-opacity-80 hover:text-blue-gray-900 focus:bg-blue-gray-50 focus:bg-opacity-80 focus:text-blue-gray-900 active:bg-blue-gray-50 active:bg-opacity-80 active:text-blue-gray-900 cursor-pointer">
        <button type="button" (click)="toggleGestiones()"
                class="flex items-center justify-between w-full p-3 font-sans text-base antialiased font-semibold leading-snug text-left transition-colors border-b-0 select-none border-b-blue-gray-100 text-blue-gray-700 hover:text-blue-gray-900 cursor-pointer">
          <div class="grid mr-4 place-items-center">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"
                 class="w-5 h-5">
              <path fill-rule="evenodd"
                    d="M2.25 2.25a.75.75 0 000 1.5H3v10.5a3 3 0 003 3h1.21l-1.172 3.513a.75.75 0 001.424.474l.329-.987h8.418l.33.987a.75.75 0 001.422-.474l-1.17-3.513H18a3 3 0 003-3V3.75h.75a.75.75 0 000-1.5H2.25zm6.04 16.5l.5-1.5h6.42l.5 1.5H8.29zm7.46-12a.75.75 0 00-1.5 0v6a.75.75 0 001.5 0v-6zm-3 2.25a.75.75 0 00-1.5 0v3.75a.75.75 0 001.5 0V9zm-3 2.25a.75.75 0 00-1.5 0v1.5a.75.75 0 001.5 0v-1.5z"
                    clip-rule="evenodd"></path>
            </svg>
          </div>
          <p class="block mr-auto font-sans text-base antialiased font-normal leading-relaxed text-blue-gray-900">
            Administración
          </p>
          <span class="ml-4">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
                 stroke="currentColor" aria-hidden="true" class="w-4 h-4 mx-auto transition-transform duration-200" [ngClass]="{'rotate-180': isGestionesOpen}">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"></path>
            </svg>
          </span>
        </button>
      </div>
      <div class="overflow-hidden">
        <div [ngClass]="{'max-h-0': !isGestionesOpen, 'max-h-96': isGestionesOpen}" class="block w-full py-1 font-sans text-sm antialiased font-light leading-normal text-gray-700 transition-all duration-300">
          <nav class="flex min-w-[240px] flex-col gap-1 p-0 font-sans text-base font-normal text-blue-gray-700">
            @for (item of menuItems; track idx; let idx = $index) {
              <div role="button" (click)="navigate(item.route)"
                   class="flex items-center w-full p-3 leading-tight transition-all rounded-lg outline-none text-start hover:bg-blue-50 hover:bg-opacity-80 hover:text-blue-900 focus:bg-blue-50 focus:bg-opacity-80 focus:text-blue-900 active:bg-blue-50 active:bg-opacity-80 active:text-blue-900 cursor-pointer"
                   [ngClass]="{'bg-blue-50 text-blue-900': isActive(item.route)}">
                <div class="grid mr-4 place-items-center">
                  <fa-icon [icon]="item.icon" class="w-5 h-5"></fa-icon>
                </div>
                <span class="font-sans text-sm antialiased font-light leading-normal">{{ item.label }}</span>
              </div>
            }
          </nav>
        </div>
      </div>
    </div>
  </div>

  <!-- Botón de cerrar sesión - SIN LÍNEA DIVISORIA Y CON CURSOR POINTER -->
  <div class="mt-auto">
    <div role="button" (click)="logout()"
         class="flex items-center w-full p-3 leading-tight transition-all rounded-lg outline-none text-start bg-blue-600 text-white hover:bg-blue-700 focus:bg-blue-700 active:bg-blue-800 rounded-br-2xl cursor-pointer">
      <div class="grid mr-4 place-items-center">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"
             class="w-5 h-5">
          <path fill-rule="evenodd"
                d="M12 2.25a.75.75 0 01.75.75v9a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM6.166 5.106a.75.75 0 010 1.06 8.25 8.25 0 1011.668 0 .75.75 0 111.06-1.06c3.808 3.807 3.808 9.98 0 13.788-3.807 3.808-9.98 3.808-13.788 0-3.808-3.807-3.808-9.98 0-13.788a.75.75 0 011.06 0z"
                clip-rule="evenodd"></path>
        </svg>
      </div>
      <span class="font-sans text-sm antialiased font-light leading-normal">Cerrar Sesión</span>
    </div>
  </div>
</div>
