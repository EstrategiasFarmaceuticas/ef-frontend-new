<!-- login.component.html -->
<div class="min-h-screen flex">
  <!-- Left side - Login form -->
  <div class="flex-1 flex items-center justify-center p-6 sm:p-12">
    <div class="w-full max-w-md">
      <div class="flex justify-center mb-6">
        <!-- Logo -->
        <img src="logo.webp" alt="Logo" class="w-auto h-12">
      </div>
      <h1 class="text-2xl font-bold text-center text-gray-800 mb-8">Inicia Sesión Con Tu Cuenta</h1>

      <form class="space-y-5">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-500">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-gray-500">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" />
        </div>
        <div class="flex items-center justify-between">
          <label class="flex items-center">
            <input type="checkbox" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded" />
            <span class="ml-2 text-sm text-gray-600">Remember me</span>
          </label>
          <div class="text-sm">
            <a href="/admin/login/forgot-password" class="font-medium text-[#1f7ec2] hover:text-[#409bd5]">Forgot password?</a>
          </div>
        </div>
        <div>
          <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-[#409bd5] hover:bg-[#1f7ec2]">Iniciar Sesión</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Right side - Image -->
  <div class="hidden lg:block lg:w-1/2 bg-cover bg-center" style="background-image: url('/login.webp');">
    <!-- Aquí debes colocar tu imagen en assets/images/login-bg.jpg -->
  </div>
</div>
