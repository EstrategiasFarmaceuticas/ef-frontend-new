<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sitio Estrategias Farmacéuticas en Construcción</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <style>
    /* Estilos generales */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      margin: 0;
    }

    .container {
      max-width: 900px;
      width: 100%;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    /* Header */
    .header {
      background-color: #1f7ec2;
      color: white;
      padding: 24px 32px;
      text-align: center;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      margin: 0;
    }

    .header i {
      margin-right: 12px;
    }

    /* Contenido principal */
    .content {
      display: flex;
      flex-direction: column;
      padding: 32px;
    }

    @media (min-width: 768px) {
      .content {
        flex-direction: row;
        align-items: center;
        gap: 32px;
        padding: 48px;
      }
    }

    .image-container {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    @media (min-width: 768px) {
      .image-container {
        width: 33%;
        margin-bottom: 0;
      }
    }

    .construction-icon {
      width: 180px;
      height: 180px;
      object-fit: contain;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .text-content {
      width: 100%;
      text-align: center;
    }

    @media (min-width: 768px) {
      .text-content {
        width: 67%;
        text-align: left;
      }
    }

    .text-content h2 {
      color: #1f7ec2;
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .text-content p {
      color: #4b5563;
      font-size: 1.125rem;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .highlight-text {
      color: #1a6cb1;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .info-box {
      background-color: #f8fafc;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 16px;
      margin-top: 24px;
    }

    .info-box p {
      color: #1e40af;
      font-weight: 500;
      margin: 0;
    }

    /* Footer */
    .footer {
      background-color: #dbeafe;
      color: #1e40af;
      text-align: center;
      padding: 16px 32px;
    }

    .footer p {
      margin-bottom: 12px;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .social-icons a {
      color: #3b82f6;
      font-size: 1.25rem;
      transition: color 0.3s;
    }

    .social-icons a:hover {
      color: #1f7ec2;
    }
  </style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <h1><i class="fas fa-tools"></i> Sitio Estrategias Farmecéuticas en Construcción</h1>
  </div>

  <!-- Contenido principal -->
  <div class="content">
    <!-- Ilustración -->
    <div class="image-container">
      <img src="https://cdn-icons-png.flaticon.com/512/2455/2455416.png"
           alt="En construcción"
           class="construction-icon">
    </div>

    <!-- Mensaje -->
    <div class="text-content">
      <div>
        <h2>¡Estamos mejorando para ti!</h2>
        <p>Nuestro equipo está trabajando arduamente para lanzar un sitio web completamente renovado.</p>
        <p class="highlight-text"><i class="fas fa-clock"></i> Vuelve a visitarnos en pocos días</p>
      </div>

      <!-- Nota adicional -->
      <div class="info-box">
        <p><i class="fas fa-info-circle"></i> Estamos implementando las últimas mejoras</p>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <p><i class="fas fa-envelope"></i> Contáctanos: soportestrategiasfs1505&#64;gmail.com</p>
    <div class="social-icons">
      <a href="https://www.facebook.com/EstratFarma/"><i class="fab fa-facebook-f"></i></a>
      <a href="https://www.instagram.com/estrategias_farmaceuticas/"><i class="fab fa-instagram"></i></a>
    </div>
  </div>
</div>
</body>
</html>
